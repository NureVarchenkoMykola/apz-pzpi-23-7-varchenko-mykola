services:
  mysql:
    image: mysql:8.0
    container_name: energy_mysql_lab4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: energy_tracker_lab4
      MYSQL_USER: energy_user
      MYSQL_PASSWORD: energy_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: energy_tracker_lab4
      DB_USER: energy_user
      DB_PASS: energy_pass
      JWT_SECRET: lab4_secret_key
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - backend_backups:/app/backups

  nginx:
    image: nginx:1.27-alpine
    container_name: energy_nginx_lab4
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  backend_backups: